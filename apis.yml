aid: mondoo
name: Mondoo
description: >-
  Mondoo is a cloud-native security and vulnerability risk management platform
  built around "Agentic Vulnerability Management" — AI agents that discover,
  prioritize by business impact, and automatically remediate vulnerabilities and
  misconfigurations across cloud accounts, containers, Kubernetes, servers,
  endpoints, SaaS products, network devices, and infrastructure-as-code. The
  platform is built on the open-source cnquery infrastructure query tool and the
  cnspec policy-as-code security scanner, both driven by MQL (the Mondoo Query
  Language), and exposes a GraphQL Platform API for programmatic access to
  assets, integrations, and vulnerability, policy, and compliance reports. Mondoo
  ships official SDKs, a Terraform provider, cnquery/cnspec CLIs with an MCP
  server interface, and packaged Agent Skills for MQL and secure coding.
